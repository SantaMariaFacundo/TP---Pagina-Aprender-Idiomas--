
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../StyleGeneral.css">
    <link rel="stylesheet" href="../../Styles Generales/headerGeneral.css">
    <link rel="stylesheet" href="../../Styles Generales/footerGeneral.css">
    <link rel="stylesheet" href="leccion.css">

    <link rel="icon"
        href="../../images/img-logo/FAVICON-LOGO-BLANCO.png"
        type="image/png">

    <title>GrammaTech - Chino Mandarín</title>
</head>

<body>

    <header>

        <div class="logo-explorar">

            <a href="../2_Vista home/home.html"
                aria-label="GrammaTech, ir al inicio">

                <img class="img-logo"
                    src="../../images/img-logo/LOGO-BLANCO.png"
                    alt="Logo de GrammaTech">

                <span class="nombre-logo">Gramma</span>
                <span class="nombre-logo-tech">Tech</span>

            </a>

        </div>

        <div class="buscador-acceder-language">

            <form class="conteiner-search" role="search">

                <input type="search"
                    class="search-class"
                    id="buscador"
                    name="buscador"
                    aria-label="Buscar becas, cursos y vocabulario"
                    placeholder="Becas, Cursos, y Vocabulario...">

                <img class="img-search"
                    src="../../images/iconosBlack-svg/search-svgrepo-com.svg"
                    alt="">

            </form>

            <nav class="navegacion" aria-label="Navegación principal">

                <a href="../2_Vista home/home.html">
                    Cursos
                </a>

                <a href="../5_Vista Perfil Usuario/perfilUsuario.html">
                    Perfil
                </a>

                <a href="../6_Vista Tabla Clasificación/clasificacion.html">
                    Clasificación
                </a>

                <a href="../7_Vista Racha/tienda.html">
                    Tienda
                </a>

            </nav>

            <select id="idioma"
                class="idioma"
                name="idioma"
                aria-label="Seleccionar idioma">

                <option value="espanol" lang="es">Es</option>
                <option value="english" lang="en">En</option>

            </select>

            <details class="menu-usuario">

                <summary aria-label="Abrir menú de usuario">

                    <img
                        src="../../images/img-index/usuario.png"
                        alt=""
                        class="icono-usuario">

                </summary>

                <div class="opciones-usuario">

                    <a href="#" id="btn-cerrar-sesion">
                        Cerrar sesión
                    </a>

                </div>

            </details>

        </div>

    </header>

    <main data-idioma="chino" data-leccion="1">

        <section aria-labelledby="titulo-ejercicio">

            <div class="barra">

                <a class="boton-atras"
                    href="../3_Vista Mapa de Unidades/progreso-chino.html"
                    aria-label="Salir de la lección">
                    x
                </a>

                <div>

                    <progress value="0"
                        max="100"
                        aria-label="Progreso de la lección">
                        0%
                    </progress>

                </div>

                <div>

                    <img
                        src="../../images/icons-general/icono-corazon.svg"
                        alt=""
                        aria-hidden="true">

                    <img
                        src="../../images/icons-general/icono-corazon.svg"
                        alt=""
                        aria-hidden="true">

                    <img
                        src="../../images/icons-general/icono-corazon.svg"
                        alt=""
                        aria-hidden="true">

                    <span class="vidas">Vidas: 3</span>

                </div>

            </div>

            <form class="card" aria-labelledby="titulo-ejercicio">

                <h1 id="titulo-ejercicio">
                    Completa la frase:
                </h1>

                <div class="frase">

                    <p lang="zh">你 ___ 吗？</p>

                    <input type="checkbox"
                        id="audio-mandarin"
                        class="audio-ingles"
                        aria-label="Escuchar la frase en chino mandarín">

                    <label for="audio-mandarin" class="btn-audio-ingles">
                        <span aria-hidden="true">🔊</span>
                    </label>

                    <div class="conteiner-audio-ingles">

                        <embed
                            src="../../audios/audio-chino-tp.mp3"
                            type="audio/mpeg"
                            autostart="true"
                            hidden="true">

                    </div>

                </div>

                <div class="opciones"
                    role="radiogroup"
                    aria-labelledby="titulo-ejercicio">

                    <div>

                        <input type="radio"
                            name="respuesta"
                            id="op1"
                            value="hao">

                        <label for="op1">
                            <span lang="zh">好</span> (bien)
                        </label>

                    </div>

                    <div>

                        <input type="radio"
                            name="respuesta"
                            id="op2"
                            value="xiexie">

                        <label for="op2">
                            <span lang="zh">谢谢</span> (gracias)
                        </label>

                    </div>

                    <div>

                        <input type="radio"
                            name="respuesta"
                            id="op3"
                            value="zaijian">

                        <label for="op3">
                            <span lang="zh">再见</span> (adiós)
                        </label>

                    </div>

                    <div>

                        <input type="radio"
                            name="respuesta"
                            id="op4"
                            value="mingzi">

                        <label for="op4">
                            <span lang="zh">名字</span> (nombre)
                        </label>

                    </div>

                </div>

                <button type="button" class="comprobar">
                    Comprobar
                </button>

            </form>

        </section>

    </main>

    <footer>

        <div class="logo-footer">

            <a href="#"
                aria-label="GrammaTech, volver arriba">

                <img class="img-logo-footer"
                    src="../../images/img-logo/LOGO-BLANCO.png"
                    alt="Logo de GrammaTech">

                <span class="nombre-logo">Gramma</span>
                <span class="nombre-logo-tech">Tech</span>

            </a>

        </div>

        <nav class="condiciones-footer"
            aria-label="Información legal y soporte">

            <p>
                <a href="">Condiciones Generales</a> -
                <a href="">Aviso Legal</a> -
                <a href="">Privacidad</a> -
                <a href="">Cookies</a> -
                <a href="">Accesibilidad</a>
            </p>

            <p>
                <a href="">Soporte y Ayuda</a>
            </p>

            <p>
                © Todos los derechos reservados,
                <time datetime="2026">2026</time>,
                GrammaTech.
            </p>

        </nav>

        <nav class="redes-footer"
            aria-label="Redes sociales">

            <a href="#">

                <img
                    src="../../images/iconosBlack-svg/instagram-rounded-svgrepo-com.svg"
                    alt="Instagram">

            </a>

            <a href="#">

                <img
                    src="../../images/iconosBlack-svg/facebook-rounded-svgr.svg"
                    alt="Facebook">

            </a>

            <a href="#">

                <img
                    src="../../images/iconosBlack-svg/twitter-rounded-svg.svg"
                    alt="Twitter">

            </a>

        </nav>

    </footer>
    <script type="module" src="./lecciones.js"></script>
</body>
</html>
