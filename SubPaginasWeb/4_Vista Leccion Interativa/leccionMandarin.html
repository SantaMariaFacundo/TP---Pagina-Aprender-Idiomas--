<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../StyleGeneral.css">
    <link rel="stylesheet" href="leccion.css">
    <link rel="icon" href="../../../images/FAVICON-LOGO-BLANCO.png" type="image/png" sizes="512x512">
    <title>GrammaTech</title>
</head>

<body>
    <header>
        <div class="logo-explorar">
            <a href="../../../../TP---Pagina-Aprender-Idiomas--/index.html"><img class="img-logo"
                    src="../../../images/img-logo/LOGO-BLANCO.png" alt="logo"><span
                    class="nombre-logo">Gramma</span><span class="nombre-logo-tech">Tech</span></a>
        </div>
        <div class="buscador-acceder-language">
            <div class="conteiner-search">
                <input type="search" class="search-class" id="buscador" placeholder="Becas, Cursos, y Vocabulario...">
                <img class="img-search" src="images/iconosBlack-svg/search-svgrepo-com.svg" alt="">
            </div>
            <p>¿Ya tenes cuenta?</p>
            <a class="acceder" href="../login.html"><span class="span-acceder">Inicia Sesión</span>
            </a>
            <select id="idioma" class="idioma">
                <option value="español">Es</option>
                <option value="english">En</option>
            </select>
        </div>
    </header>
    <main>
        <section>
            <div class="barra">
                <a href="">x</a>
                <div>
                    <progress value="80" max="100"></progress>
                    <span>80%</span>
                </div>
                <div>
                    <img src="../../images/icons-general/icono-corazon.svg" alt="vida">
                    <img src="../../images/icons-general/icono-corazon.svg" alt="vida">
                    <img src="../../images/icons-general/icono-corazonvacio.svg" alt="corazon vacio">
                    <span class="vidas">Vidas: 2</span>
                </div>
            </div>
            <div class="card">
                <h1>Completa la frase:</h1>
                <div class="frase">
                    <p lang="zh">你 ___ 吗？</p>
                    <button type="button">🔊</button>
                </div>
                <div class="opciones">
                    <div>
                        <input type="radio" name="respuesta" id="op1" value="hao">
                        <label for="op1">好 (bien)</label>
                    </div>
                    <div>
                        <input type="radio" name="respuesta" id="op2" value="xiexie">
                        <label for="op2">谢谢 (gracias)</label>
                    </div>
                    <div>
                        <input type="radio" name="respuesta" id="op3" value="zaijian">
                        <label for="op3">再见 (adiós)</label>
                    </div>
                    <div>
                        <input type="radio" name="respuesta" id="op4" value="mingzi">
                        <label for="op4">名字 (nombre)</label>
                    </div>
                </div>
                <button type="button" class="comprobar">Comprobar</button>
            </div>
        </section>
    </main>
    <footer>
        <div class="logo-footer">
            <a href="#"><img class="img-logo-footer" src="../../../images/img-logo/LOGO-BLANCO.png" alt="logo"><span
                    class="nombre-logo">Gramma</span><span class="nombre-logo-tech">Tech</span></a>
        </div>
        <div class="condiciones-footer">
            <p> <a href="">Condiciones Generales</a> - <a href="">Aviso Legal</a> - <a href="">Privacidad</a> - <a
                    href="">Cookies</a> - <a href="">Accesibilidad</a>
            </p>
            <p> <a href="">Soporte y Ayuda</a></p>
            <p>© Todos los derechos reservados, 2026, Gramatech.</p>
        </div>
        <div class="redes-footer">
            <a href="#">
                <img src="../../../images/iconosBlack-svg/instagram-rounded-svgrepo-com.svg" alt="link redes instagram">
            </a>
            <a href="#">
                <img src="../../../images/iconosBlack-svg/facebook-rounded-svgr.svg" alt="link redes facebook ">
            </a>
            <a href="#">
                <img src="../../../images/iconosBlack-svg/twitter-rounded-svg.svg" alt="link redes twitter">
            </a>
        </div>
    </footer>
</body>

</html>
