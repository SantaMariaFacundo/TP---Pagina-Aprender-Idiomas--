<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Lección de Inglés - GrammaTech</title>

<body>

    <header>

        <div class="logo-explorar">

            <a href="../../2_Vista home/home.html">

                <img
                    class="img-logo"
                    src="../../../images/img-logo/LOGO-BLANCO.png"
                    alt="Logo de GrammaTech">

                <span class="nombre-logo">Gramma</span>
                <span class="nombre-logo-tech">Tech</span>

            </a>

        </div>

        <div class="buscador-acceder-language">

            <form class="conteiner-search" role="search">

                <input
                    type="search"
                    class="search-class"
                    id="buscador"
                    name="buscador"
                    aria-label="Buscar en el sitio"
                    placeholder="Becas, Cursos, y Vocabulario...">

                <img
                    class="img-search"
                    src="../../../images/iconosBlack-svg/search-svgrepo-com.svg"
                    alt="">

            </form>

            <nav class="navegacion" aria-label="Navegación principal">

                <a href="../../2_Vista home/home.html">
                    Cursos
                </a>

                <a href="../../5_Vista Perfil Usuario/perfilUsuario.html">
                    Perfil
                </a>

                <a href="../../6_Vista Tabla Clasificación/clasificacion.html">
                    Clasificación
                </a>

                <a href="../../7_Vista Racha/tienda.html">
                    Tienda
                </a>

            </nav>

            <select id="idioma" class="idioma" aria-label="Idioma del sitio">

                <option value="espanol">
                    Es
                </option>

                <option value="english">
                    En
                </option>

            </select>

        </div>

    </header>


    <main>

        <section aria-labelledby="consigna">

            <div class="barra">

                <a class="boton-atras" href="../../3_Vista Mapa de Unidades/progreso-ingles.html" aria-label="Salir de la lección">x</a>

                <progress value="0" max="100" aria-label="Progreso de la lección">0%</progress>

                <p>
                    <img src="../../../images/icons-general/icono-corazon.svg" alt="">
                    <img src="../../../images/icons-general/icono-corazon.svg" alt="">
                    <img src="../../../images/icons-general/icono-corazon.svg" alt="">
                    <span class="vidas">Vidas: 3</span>
                </p>

            </div>

            <form class="card">

                <h1 id="consigna">Elegí la traducción correcta:</h1>

                <div class="frase">

                    <p lang="en">"I would like to order a coffee, please"</p>

                    <audio controls src="../../../audios/audio-ingles-tp.mp3">
                        Tu navegador no puede reproducir este audio.
                    </audio>

                </div>

                <fieldset class="opciones" aria-labelledby="consigna">

                    <label>
                        <input type="radio" name="respuesta" value="te">
                        Me gustaría pedir un té, por favor
                    </label>

                    <label>
                        <input type="radio" name="respuesta" value="cafe">
                        Quisiera pedir un café, por favor
                    </label>

                    <label>
                        <input type="radio" name="respuesta" value="mesa">
                        Necesito una mesa para dos, por favor
                    </label>

                    <label>
                        <input type="radio" name="respuesta" value="cuenta">
                        ¿Podría traerme la cuenta, por favor?
                    </label>

                </fieldset>

                <button class="comprobar" type="button">Comprobar</button>

            </form>

        </section>

    </main>

    <footer>

        <div class="logo-footer">

            <a href="../../2_Vista home/home.html">

                <img
                    class="img-logo-footer"
                    src="../../../images/img-logo/LOGO-BLANCO.png"
                    alt="Logo de GrammaTech">

                <span class="nombre-logo">Gramma</span>
                <span class="nombre-logo-tech">Tech</span>

            </a>

        </div>

                <small>© Todos los derechos reservados, 2026, GrammaTech.</small>
            </p>

        </nav>


        <nav class="redes-footer" aria-label="Redes sociales">

            <a href="#">
                <img
                    src="../../../images/iconosBlack-svg/instagram-rounded-svgrepo-com.svg"
                    alt="Instagram">
            </a>

            <a href="#">
                <img
                    src="../../../images/iconosBlack-svg/facebook-rounded-svgr.svg"
                    alt="Facebook">
            </a>

            <a href="#">
                <img
                    src="../../../images/iconosBlack-svg/twitter-rounded-svg.svg"
                    alt="Twitter">

        </nav>
