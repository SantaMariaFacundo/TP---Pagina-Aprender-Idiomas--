<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="../../../StyleGeneral.css">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="../../../images/FAVICON-LOGO-BLANCO.png" type="image/png" sizes="512x512">
    <title>GrammaTech</title>
</head>

<body>


    <header>
        <div class="logo-explorar">
            <a href="#"><img class="img-logo" src="../../../images/LOGO-BLANCO.png" alt="logo"><span
                    class="nombre-logo">Gramma</span><span class="nombre-logo-tech">Tech</span></a>
            <a class="boton-explora" href="">Explora </a>
        </div>
        <div class="buscador-acceder-language">
            <div class="conteiner-search">
                <input type="search" class="search-class" id="buscador" placeholder="Becas, Cursos, y Vocabulario...">
                
            </div>
            <a class="acceder login" href="">Registrate</a>
            <a class="language" href="">Es</a>
        </div>
    </header>




    <main>

        <div class="contenedor">
            <div class="form-caja">
                <form action="">

                    <div class="iniciar-redes">

                    <h2>Inicia sesión con: </h2>

                    <div class="redes">
                        
                        <a href="#"> <img class="img-redes" src="../../images/google-icon.svg" alt="Google"></a>
                        <a href="#"> <img class="img-redes" src="../../images/facebook.svg" alt="Facebook"></a>
                        <a href="#"> <img class="img-redes" src="../../images/microsoft-icon.svg" alt="Microsoft"></a>
                        <a href="#"> <img class="img-redes" src="../../images/linkedin-icon.svg" alt="Google"></a>


                    </div>


                    </div>


                    <div class="relleno">
                        <input type="email" name="correo" placeholder="tu-nombre@correo.com">
                    </div>

                    <div class="relleno">
                        <input type="contraseña" name="contraseña" placeholder="Contraseña">
                    </div>

                    <div class="olvido-contraseña">

                            <a href="#">Olvidé mi contraseña</a>
                    </div>

                    <div class="registrarse">

                            <a href="#">¿No tenes cuenta en GrammaTech? Registrate</a>
                    </div>

                    <button type="submit">Iniciar Sesión</button>

                </form>

            </div>

        </div>

       
    </main>











    <footer>
        <div class="logo-footer">
            <a href="#"><img class="img-logo-footer" src="../../../images/LOGO-BLANCO.png" alt="logo"><span
                    class="nombre-logo">Gramma</span><span class="nombre-logo-tech">Tech</span></a>
        </div>
        <div class="condiciones-footer">
            <p> <a href="">Condiciones Generales</a> - <a href="">Aviso Legal</a> - <a href="">Privacidad</a> - <a
                    href="">Cookies</a> - <a href="">Accesibilidad</a>
            </p>
            <p> <a href="">Soporte y Ayuda</a></p>
            <p>© Todos los derechos reservados, 2026, Gramatech.</p>
        </div>
        <div class="redes-footer">
            <a href="#"><i class="fa-brands fa-square-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-square-facebook"></i></a>
            <a href="https://github.com/SantaMariaFacundo/TP---Pagina-Aprender-Idiomas--"><i
                    class="fa-brands fa-square-github"></i></a>
            <a href="#"><i class="fa-brands fa-square-x-twitter"></i></a>
        </div>
    </footer>
</body>

</html>
