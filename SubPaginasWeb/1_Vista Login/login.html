
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../StyleGeneral.css">
    <link rel="stylesheet" href="../../Styles Generales/headerGeneral.css">
    <link rel="stylesheet" href="../../Styles Generales/footerGeneral.css">
    <link rel="stylesheet" href="login.css">

    <link rel="icon" href="../../images/img-logo/FAVICON-LOGO-BLANCO.png" type="image/png" sizes="512x512">

    <title>GrammaTech</title>
</head>

<body>

    <header>
        <div class="logo-explorar">
            <a href="../../index.html" aria-label="GrammaTech, ir al inicio">
                <img class="img-logo" src="../../images/img-logo/LOGO-BLANCO.png" alt="Logo de GrammaTech">
                <span class="nombre-logo">Gramma</span>
                <span class="nombre-logo-tech">Tech</span>
            </a>
        </div>

        <div class="buscador-acceder-language">
            <p id="texto-sin-cuenta">¿Aún no tenés cuenta?</p>

            <a class="btn-acceder" href="Vista Registro/registro.html">
                <span class="span-registrate">Registrate</span>
            </a>

            <select id="idioma" class="idioma" name="idioma" aria-label="Seleccionar idioma">
                <option value="español" lang="es">Es</option>
                <option value="english" lang="en">En</option>
            </select>
        </div>
    </header>

    <main>

        <nav class="boton-volver" aria-label="Volver a la página principal">
            <a class="link-volver" href="../../index.html">
                <img src="../../images/icons-general/icono-volver.svg" alt="">
                Volver
            </a>
        </nav>

        <div class="contenedor">

            <div class="form-caja">

                <form action="../2_Vista home/home.html" method="get" aria-label="Iniciar sesión">

                    <section class="completar-datos" aria-labelledby="titulo-completar-datos">

                        <h2 id="titulo-completar-datos">Ingresá tus datos:</h2>

                        <div class="relleno">
                            <div class="relleno-label">
                                <label for="email">Email</label>
                            </div>

                            <input type="email" name="correo" id="email"
                                placeholder="tu-nombre@correo.com"
                                autocomplete="email" required>
                        </div>

                        <div class="relleno">
                            <div class="relleno-label">
                                <label for="contraseña">Contraseña</label>
                            </div>

                            <input type="password" name="password" id="contraseña"
                                placeholder="Contraseña"
                                autocomplete="current-password" required>
                        </div>

                        <button class="boton-iniciar" type="submit">
                            Iniciar Sesión
                        </button>

                    </section>

                    <nav class="links-login" aria-label="Ayuda con la cuenta">
                        <div class="registrarse">
                            <a href="Vista Registro/registro.html">
                                ¿No tenés cuenta en GrammaTech? Registrate
                            </a>
                        </div>
                    </nav>

                </form>

            </div>

        </div>

    </main>

    <footer>

        <div class="logo-footer">
            <a href="../../index.html" aria-label="GrammaTech, ir al inicio">
                <img class="img-logo-footer" src="../../images/img-logo/LOGO-BLANCO.png" alt="Logo de GrammaTech">
                <span class="nombre-logo">Gramma</span>
                <span class="nombre-logo-tech">Tech</span>
            </a>
        </div>

        <nav class="condiciones-footer" aria-label="Información legal y soporte">
            <p>
                <a href="">Condiciones Generales</a> -
                <a href="">Aviso Legal</a> -
                <a href="">Privacidad</a> -
                <a href="">Cookies</a> -
                <a href="">Accesibilidad</a>
            </p>

            <p><a href="">Soporte y Ayuda</a></p>

            <p>
                © Todos los derechos reservados,
                <time datetime="2026">2026</time>,
                GrammaTech.
            </p>
        </nav>

        <nav class="redes-footer" aria-label="Redes sociales">
            <a href="#">
                <img src="../../images/iconosBlack-svg/instagram-rounded-svgrepo-com.svg" alt="Instagram">
            </a>

            <a href="#">
                <img src="../../images/iconosBlack-svg/facebook-rounded-svgr.svg" alt="Facebook">
            </a>

            <a href="#">
                <img src="../../images/iconosBlack-svg/twitter-rounded-svg.svg" alt="Twitter">
            </a>
        </nav>

    </footer>

    <script src="../../js/usuarios.js"></script>
    <script src="loginFunciones.js"></script>

</body>

</html>
